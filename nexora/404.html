<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | Page not found</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Outfit', sans-serif;
            background: #030308;
            color: #fff;
            background-image:
                linear-gradient(rgba(124,58,237,.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37,99,235,.055) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        main { max-width: 460px; }

        h1 {
            font-size: clamp(72px, 16vw, 120px);
            line-height: 1;
            background: linear-gradient(90deg, #A855F7, #7C3AED, #2563EB);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 { margin: 18px 0 10px; font-size: 26px; }

        p { color: #aaa; line-height: 1.6; }

        .actions { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; }

        a {
            padding: 12px 24px;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid rgba(168,85,247,.3);
        }

        a.primary {
            background: linear-gradient(135deg, #7C3AED, #2563EB);
            border-color: transparent;
        }

        a:focus-visible { outline: 2px solid #A855F7; outline-offset: 3px; }
    </style>

</head>

<body>

    <main>

        <h1>404</h1>

        <h2>This page doesn't exist</h2>

        <p>The link may be old or mistyped. Your progress is safe.</p>

        <div class="actions">
            <a class="primary" href="dashboard.html">Go to dashboard</a>
            <a href="index.html">Back to home</a>
        </div>

    </main>

</body>

</html>
